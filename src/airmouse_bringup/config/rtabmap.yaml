# RTAB-Map parameters. Phase 2: mapping only, on external (ground-truth) odometry.
# PLAN.md names -> RTAB-Map names: grid_resolution -> Grid/CellSize;
# grid_height_band (0.2-2.2 m) -> Grid/MaxGroundHeight .. Grid/MaxObstacleHeight.
# Set by localization.launch.py from launch arguments: subscribe_scan, Grid/Sensor.
rtabmap:
  ros__parameters:
    frame_id: base_link
    map_frame_id: map
    subscribe_rgb: true
    subscribe_depth: true
    approx_sync: true              # camera (15 Hz) + LiDAR (10 Hz) + odom (50 Hz)
    sync_queue_size: 20
    topic_queue_size: 10
    publish_tf: true               # map -> odom (identity while loop closure is off)
    map_always_update: true        # republish /map every update, also while hovering

    Rtabmap/DetectionRate: "2"     # map updates per second (contract: /map at 1-2 Hz)
    Mem/IncrementalMemory: "true"  # mapping mode
    Kp/MaxFeatures: "-1"           # no visual words -> no loop closure (exact pose in Phase 2)
    Reg/Force3DoF: "false"         # keep roll/pitch: the drone tilts when it accelerates, and
                                   # dropping the tilt lifts floor points into the wall band

    Grid/3D: "false"               # 2D occupancy grid only
    Grid/CellSize: "0.05"          # grid_resolution
    Grid/RangeMax: "3.0"           # depth reliable range; same cap for the LiDAR
    Grid/MapFrameProjection: "true"  # heights measured from the floor (map frame), not the drone
    Grid/NormalsSegmentation: "false"
    Grid/MaxGroundHeight: "0.2"    # grid_height_band lower edge: below = floor (free)
    Grid/MaxObstacleHeight: "2.2"  # grid_height_band upper edge: above = ignored (net ceiling)
    Grid/RayTracing: "true"        # mark free space between the sensor and each obstacle
    Grid/NoiseFilteringRadius: "0.1"        # drop obstacle points with fewer than
    Grid/NoiseFilteringMinNeighbors: "5"    # 5 neighbours within 0.1 m (depth speckle)

# ---------------------------------------------------------------------------- Phase 6
# Odometry from sensors (use_ground_truth:=false). Both publish /rtabmap/odom for the EKF and
# no TF (the EKF owns odom -> base_link).
icp_odometry:                       # use_lidar:=true: laser scan matching
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    publish_tf: false
    wait_for_transform: 0.2
    expected_update_rate: 15.0
    Reg/Force3DoF: "true"           # a 2D scan gives x, y and yaw only
    Odom/Strategy: "0"              # frame-to-map
    Odom/ResetCountdown: "1"        # restart from the last pose after a failed match
    Odom/ScanKeyFrameThr: "0.6"
    OdomF2M/ScanSubtractRadius: "0.05"
    OdomF2M/ScanMaxSize: "3000"
    Icp/VoxelSize: "0.05"
    Icp/MaxCorrespondenceDistance: "0.15"
    Icp/PointToPlane: "true"
    Icp/PointToPlaneK: "5"
    Icp/Iterations: "10"
    Icp/Epsilon: "0.001"
    Icp/CorrespondenceRatio: "0.3"
rgbd_odometry:                      # use_lidar:=false: visual odometry from colour + depth
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    publish_tf: false
    wait_for_transform: 0.2
    approx_sync: true
    sync_queue_size: 10
    Odom/Strategy: "0"              # frame-to-map
    Odom/ResetCountdown: "1"
    Vis/MaxFeatures: "600"          # Raspberry Pi budget: limited feature count
    Vis/MinInliers: "12"
    Vis/MaxDepth: "4.0"
    GFTT/MinDistance: "7"
